name: Windows Production Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Install ImageMagick
        run: choco install imagemagick -y

      - name: Generate Windows Icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          magick public/assets/logo.png -resize 1024x1024 -background none -gravity center -extent 1024x1024 build/icon.png
          magick build/icon.png -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico
          Get-Item build/icon.ico

      - name: Build Windows Installer
        run: npm run dist

      - name: Upload Windows Installer Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlKhazina-Windows-Setup
          path: release/AlKhazina_Setup_v*.exe
          if-no-files-found: error
